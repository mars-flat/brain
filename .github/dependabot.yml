# Grouped weekly dependency PRs (§9.3); auto-merge stays manual until CI has
# earned trust. Actions bumps keep the SHA pins current.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
