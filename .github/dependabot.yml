# Grouped weekly dependency PRs (§9.3); auto-merge stays manual until CI has
# earned trust. Actions bumps keep the SHA pins current.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns: ["*"]
    ignore:
      # ADR 0001: dependency-cruiser cannot parse TS7, so the §3 purity gate
      # passes vacuously under it. Hold at 6.x until depcruise supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
