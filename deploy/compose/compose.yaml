# Production shape (§3.1): one gateway container on an internal network,
# published on host loopback ONLY — `tailscale serve` on the VM fronts it
# over the tailnet with TLS. No public IP, no public port, ever.
#
#   docker compose -f deploy/compose/compose.yaml up -d
#
# Required env (compose reads deploy/compose/.env on the VM — gitignored):
#   GATEWAY_ISSUER    IdP issuer URL (Auth0 tenant at P5, §4.3)
#   GATEWAY_RESOURCE  the URL clients reach, e.g. https://<vm>.tailnet.ts.net/mcp
#   BRAIN_DATA_DIR    host dir holding vault/ (VM: /data)
#   OPENAI_API_KEY    for LLM extraction in the brain upstream
name: brain

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    image: ghcr.io/mars-flat/brain-gateway:${TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      BRAIN_VAULT_PATH: /data/vault
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8090"
      GATEWAY_ISSUER: ${GATEWAY_ISSUER:?IdP issuer URL}
      GATEWAY_AUDIENCE: ${GATEWAY_AUDIENCE:-brain-gateway}
      GATEWAY_RESOURCE: ${GATEWAY_RESOURCE:?advertised /mcp URL (tailnet)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # queue = §5.8 batched cadence (`brain consolidate --batch` on a timer
      # does the extraction); ingest returns fast and never bills inline.
      BRAIN_INGEST_MODE: ${BRAIN_INGEST_MODE:-queue}
      # W2 (mcp-google): the Desktop OAuth client creds — client identity,
      # not account secrets; per-account refresh tokens stay envelope-
      # encrypted in the vault's secret store as ${secret:google/*} refs.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    volumes:
      - ${BRAIN_DATA_DIR:-/data}/vault:/data/vault
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    healthcheck:
      # PRM endpoint is unauthenticated by design (RFC 9728) — ideal probe.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:8090/.well-known/oauth-protected-resource'); if (!r.ok) process.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The web console (§15): same image, different entrypoint. Read-only over
  # the vault by code discipline; identity via OIDC (§15.2). Loopback publish —
  # the TLS front (Caddy) is the only thing that reaches it from outside.
  console:
    image: ghcr.io/mars-flat/brain-gateway:${TAG:-local}
    restart: unless-stopped
    entrypoint: ["bun", "/app/packages/console/src/main.ts"]
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      BRAIN_VAULT_PATH: /data/vault
      CONSOLE_HOST: 0.0.0.0
      CONSOLE_PORT: "8091"
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:?public base URL of the console}
      CONSOLE_ISSUER: ${GATEWAY_ISSUER:?IdP issuer URL}
      CONSOLE_CLIENT_ID: ${CONSOLE_CLIENT_ID:?OIDC client id for the console}
      CONSOLE_CLIENT_SECRET: ${CONSOLE_CLIENT_SECRET:-}
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET:?random >=16 chars}
      CONSOLE_ALLOWED_SUB: ${CONSOLE_ALLOWED_SUB:-}
      CONSOLE_GATEWAY_PRM_URL: http://gateway:8090/.well-known/oauth-protected-resource
      # Optional: lets the dashboard's service probes check these keys live
      # (§15.4). Absent keys just degrade the cards to config-only.
      # OPENAI_ADMIN_KEY is an org Admin key (api.usage.read) — the only
      # kind the costs endpoint accepts; it powers the spend line.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ADMIN_KEY: ${OPENAI_ADMIN_KEY:-}
      VERCEL_API_TOKEN: ${VERCEL_API_TOKEN:-}
    volumes:
      - ${BRAIN_DATA_DIR:-/data}/vault:/data/vault
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    depends_on:
      - gateway
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:8091/healthz'); if (!r.ok) process.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The TLS edge (§15.1) — production only (compose profile "edge", enabled
  # on the VM via COMPOSE_PROFILES=edge in its .env). Binds 443 on the host;
  # the VM has no public IP, so "the host" means the tailnet and nothing
  # else. The cert comes from deploy/vm/certs.sh (lego DNS-01) via the
  # shared volume; Caddy only serves it.
  caddy:
    profiles: ["edge"]
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:-console.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certs:/certs:ro
      - caddy-state:/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    depends_on:
      - gateway
      - console

volumes:
  certs:
  caddy-state:
