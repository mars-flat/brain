# Synthetic upstream MCP server inventory (§4.2). The REAL inventory lives in
# your private vault. urn = <name>.<tool>; env values expand ${VAR}; `kinds`
# overrides risk classification when annotations/heuristics get it wrong.
servers:
  - name: brain
    command: bun
    args: [packages/brain-mcp/src/main.ts]
    env:
      BRAIN_VAULT_PATH: ${BRAIN_VAULT_PATH}
      # empty → sync; "queue" → §5.8 batched cadence (the P5 VM sets it)
      BRAIN_INGEST_MODE: ${BRAIN_INGEST_MODE}

  - name: files
    command: bunx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    kinds:
      - pattern: "edit_*"
        kind: write
