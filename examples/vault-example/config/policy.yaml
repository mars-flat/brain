# Synthetic policy for the example vault (§4.5). First match wins; the
# default rule must be last. The REAL policy lives in your private vault's
# config/, never in the public repo (§9.2).

- match: { tool: "brain.*", kind: read }
  effect: allow

# Headless SessionEnd delivery (§6.4 P5): high-trust memory writes are
# direct per §6.5, and brain.ingest revalidates + trust-gates the envelope.
- match: { tool: "brain.ingest", kind: write, surface: [http, cli] }
  effect: allow

- match: { surface: [discord], kind: write }
  effect: confirm
  reason: "medium-trust surface, write operation"

- match: { surface: [discord], tool: ["shell.*", "fs.write", "*.delete_*"] }
  effect: deny

# The no-send rule (W2): send-shaped tools die here by pattern, before any
# upstream call — even if some upstream ever advertises one.
- match: { tool: ["*.send_*", "*.send", "*send_message*", "*send_email*", "*send_draft*"] }
  effect: deny
  reason: "email sending is disabled at the gateway, permanently, by owner rule"

- match: { kind: read }
  effect: allow

- default: confirm
